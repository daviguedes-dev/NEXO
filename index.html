<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <meta
      name="description"
      content="Nexo — organização pessoal e operacional: rotinas, tarefas, métodos de trabalho e publicações com histórico rastreável."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Nexo — Organização pessoal e operacional</title>
    <style>
      /* Exibido só enquanto o app carrega; some quando o React assume o #root. */
      .boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f1f5f9;
        color: #334155;
        font:
          15px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        padding: 24px;
      }
      .boot__help {
        max-width: 560px;
        padding: 24px 28px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        opacity: 0;
        animation: boot-show 0.2s 2.5s forwards;
      }
      .boot__help h1 {
        margin: 0 0 8px;
        font-size: 18px;
        color: #0b1220;
      }
      .boot__help code {
        background: #f1f5f9;
        padding: 1px 6px;
        border-radius: 4px;
      }
      @keyframes boot-show {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot__help" role="status">
          <h1>O Nexo não carregou</h1>
          <p>Este arquivo é o código-fonte e não abre direto no navegador. Use uma destas opções:</p>
          <ul>
            <li>abra o arquivo <code>Nexo.html</code> (versão pronta, funciona com duplo clique);</li>
            <li>ou, na pasta do projeto, rode <code>npm install</code> e <code>npm run dev</code> e acesse o endereço exibido.</li>
          </ul>
        </div>
      </div>
    </div>
    <noscript>O Nexo precisa de JavaScript habilitado para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
